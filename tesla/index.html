<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tesla connected</title>
<style>body{font:16px -apple-system,system-ui,sans-serif;background:#F6F3EC;color:#2F3A33;padding:24px;max-width:600px;margin:auto}
textarea{width:100%;height:110px;border-radius:12px;border:1px solid #E6E0D3;padding:10px;font:13px monospace}
button{background:#6B8F71;color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:600;margin-top:10px}</style>
</head><body>
<h2>Almost done</h2>
<p>Copy the text below and paste it into the <b>Tesla setup</b> page of your Personal Hub.</p>
<textarea id="t" readonly></textarea>
<button onclick="navigator.clipboard.writeText(document.getElementById('t').value);this.textContent='Copied ✓'">Copy</button>
<p style="color:#7A837C;font-size:13px">This page never sends anything anywhere. It only shows the one-time code Tesla put in the address bar.</p>
<script>document.getElementById('t').value = location.href;</script>
</body></html>
